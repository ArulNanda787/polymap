[project]
name = "polymap"
version = "0.2.0"
description = "Temporal graph learning for wallet relationship discovery in prediction markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.32",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
model = ["torch>=2.2", "torch-geometric>=2.5"]
viz = ["matplotlib>=3.8", "networkx>=3.2", "plotly>=5.18", "streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.5"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]


[project.scripts]
polymap = "polymap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymap"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
